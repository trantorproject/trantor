kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g

# Publishes only the checksums Maven Central requires (md5 and sha1), not sha256 and sha512: Sonatype limits the
# files an organization publishes in a month, and those two were a third of every release.
systemProp.org.gradle.internal.publish.checksums.insecure=true
